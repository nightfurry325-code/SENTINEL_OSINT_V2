<p align="center">
<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sentinelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="#0B0F17"/>

  <line x1="50" y1="30" x2="1150" y2="30"
        stroke="#00F5FF" stroke-width="2" opacity="0.5"/>

  <line x1="50" y1="150" x2="1150" y2="150"
        stroke="#00F5FF" stroke-width="2" opacity="0.5"/>

  <text x="600"
        y="90"
        text-anchor="middle"
        font-size="68"
        font-family="Consolas, Monaco, monospace"
        font-weight="900"
        fill="url(#sentinelGradient)"
        filter="url(#glow)">
        SENTINEL
  </text>

  <text x="600"
        y="125"
        text-anchor="middle"
        font-size="18"
        font-family="Segoe UI, Arial"
        fill="#C0C7D1">
        ADVANCED OSINT INTELLIGENCE FRAMEWORK
  </text>

</svg>
</p>
