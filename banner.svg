<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="15" y="15" width="1170" height="230"
        fill="none"
        stroke="#00F5FF"
        stroke-width="2"/>

  <!-- Decorative lines -->
  <line x1="60" y1="60" x2="1140" y2="60"
        stroke="#00F5FF"
        stroke-width="1"/>

  <line x1="60" y1="200" x2="1140" y2="200"
        stroke="#00F5FF"
        stroke-width="1"/>

  <!-- Corner accents -->
  <line x1="15" y1="15" x2="80" y2="15" stroke="#00FF88" stroke-width="4"/>
  <line x1="15" y1="15" x2="15" y2="80" stroke="#00FF88" stroke-width="4"/>

  <line x1="1185" y1="15" x2="1120" y2="15" stroke="#00FF88" stroke-width="4"/>
  <line x1="1185" y1="15" x2="1185" y2="80" stroke="#00FF88" stroke-width="4"/>

  <line x1="15" y1="245" x2="80" y2="245" stroke="#00FF88" stroke-width="4"/>
  <line x1="15" y1="245" x2="15" y2="180" stroke="#00FF88" stroke-width="4"/>

  <line x1="1185" y1="245" x2="1120" y2="245" stroke="#00FF88" stroke-width="4"/>
  <line x1="1185" y1="245" x2="1185" y2="180" stroke="#00FF88" stroke-width="4"/>

  <!-- Logo -->
  <circle cx="160" cy="130" r="40"
          fill="none"
          stroke="#00F5FF"
          stroke-width="4"/>

  <circle cx="160" cy="130" r="12"
          fill="#00FF88"/>

  <!-- Title -->
  <text x="650"
        y="125"
        text-anchor="middle"
        fill="url(#title)"
        font-size="72"
        font-family="Consolas, Monaco, monospace"
        font-weight="bold">
    SENTINEL
  </text>

  <!-- Subtitle -->
  <text x="650"
        y="165"
        text-anchor="middle"
        fill="#D1D5DB"
        font-size="20"
        font-family="Arial">
    ADVANCED OSINT INTELLIGENCE FRAMEWORK
  </text>

</svg>
